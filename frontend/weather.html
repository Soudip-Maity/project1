<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather app</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div id="container">
        <div class="search">
            <input type="text" spellcheck="false" placeholder="enter a city name">   
            <button>search</button>  
            <button id="mode">mode</button> 
        </div>
        <div id="weather">
          <h1 class="temp">22°C</h1>
          <h2 class="city">kolkata</h2>

        </div>
        <div class="info">
          <div class="humidity">  <h4 >humidity: 50%</h4> </div>
            
          <div class="wind_speed">  <h4>wind speed: 15 km/h</h4></div>
        </div>
    </div>
  <script src="weather.js"></script>  
</body>
</html>
