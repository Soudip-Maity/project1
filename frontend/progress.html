<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <link rel="stylesheet" href="progress.css">
</head>
<body>
    <div class="container">
        <h1>Progress Bar </h1>
        <div class="buttons">
            <button id="htmlBtn"  onclick = "this. disabled = true; ">HTML</button>
            <button id="cssBtn"  onclick = "this. disabled = true; ">CSS</button>
            <button id="jsBtn"  onclick = "this. disabled = true; ">JS</button>
        </div>
        <div class="progress-container">
            <progress id="progressBar" value="0" max="3"></progress>
        </div>
    </div>

    <script src="progress.js"></script>
</body>
</html>
